[package]
name = "xag-site"
version = "0.1.0"
edition = "2021"
description = "The website for Xag"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8", features = ["csr"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
