[package]
name = "xag-site"
version = "0.1.0"
edition = "2021"
description = "The website for Xag"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "xag_site"
path = "src/lib.rs"

# The site itself, compiled to WebAssembly.
[[bin]]
name = "xag-site"
path = "src/main.rs"

# Writes the HTML that is served before the WebAssembly has loaded. Behind a
# feature so that building for wasm32 does not try to build it too.
[[bin]]
name = "prerender"
path = "src/prerender.rs"
required-features = ["prerender"]

# Checks the playground against the real compiler. Needs `xagc`, so it is not
# part of any build.

[features]
prerender = []

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "NodeList", "MediaQueryList", "Node", "Storage", "History", "Location", "PopStateEvent", "ScrollRestoration", "DomRect"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "verify-samples"
path = "src/verify_samples.rs"
required-features = ["prerender"]
